name: Build alarm test APK
on:
  push:
    paths:
      - 'android-alarm-test/**'
      - '.github/workflows/alarm-test-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check schedule rules and reject anonymous API requests
        run: |
          node android-alarm-test/backend/schedule.test.mjs
          status=$(curl --silent --show-error --max-time 30 --output /tmp/alarm-api.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"action":"sync"}' https://lqqjyedfwlqinppcrvjf.supabase.co/functions/v1/app-alarm)
          test "$status" = "401"
          status=$(curl --silent --show-error --max-time 30 --output /tmp/alarm-api.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"action":"exchange","code":"invalid"}' https://lqqjyedfwlqinppcrvjf.supabase.co/functions/v1/app-alarm)
          test "$status" = "400"
      - name: Build and lint
        working-directory: android-alarm-test
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shift-alarm-test-apk
          path: android-alarm-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
