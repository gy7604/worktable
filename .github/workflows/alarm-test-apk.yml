name: Build alarm test APK
on:
  push:
    paths:
      - 'android-alarm-test/**'
      - '.github/workflows/alarm-test-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alarm-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check schedule rules and reject anonymous API requests
        run: |
          node android-alarm-test/backend/schedule.test.mjs
          node android-alarm-test/backend/widget.test.mjs
          javac -d /tmp/alarm-time-tests android-alarm-test/app/src/main/java/io/github/gy7604/alarmtest/AlarmTime.java android-alarm-test/tests/AlarmTimeRegression.java
          java -cp /tmp/alarm-time-tests io.github.gy7604.alarmtest.AlarmTimeRegression
          status=$(curl --silent --show-error --max-time 30 --output /tmp/alarm-api.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"action":"sync"}' https://lqqjyedfwlqinppcrvjf.supabase.co/functions/v1/app-alarm)
          test "$status" = "401"
          status=$(curl --silent --show-error --max-time 30 --output /tmp/alarm-api.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"action":"exchange","code":"invalid"}' https://lqqjyedfwlqinppcrvjf.supabase.co/functions/v1/app-alarm)
          test "$status" = "400"
      - name: Restore private signing key
        env:
          SIGNING_JSON: ${{ secrets.SHIFT_ALARM_SIGNING_JSON }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path
          raw = os.environ.get('SIGNING_JSON', '')
          if not raw:
              raise SystemExit('Add repository secret SHIFT_ALARM_SIGNING_JSON using android-alarm-test/tools/setup-signing.ps1. No random debug APK will be published.')
          data = json.loads(raw)
          for field in ('keystore', 'password', 'alias'):
              if not isinstance(data.get(field), str) or not data[field] or '\n' in data[field] or '\r' in data[field]:
                  raise SystemExit('Invalid signing configuration')
          print('::add-mask::' + data['password'])
          path = Path(os.environ['RUNNER_TEMP']) / 'shift-alarm.p12'
          path.write_bytes(base64.b64decode(data['keystore'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key, value in {'ALARM_KEYSTORE_PATH': str(path), 'ALARM_STORE_PASSWORD': data['password'], 'ALARM_KEY_ALIAS': data['alias'], 'ALARM_KEY_PASSWORD': data['password']}.items():
                  f.write(key + '=' + value + '\n')
          PY
      - name: Build and lint
        working-directory: android-alarm-test
        run: gradle assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shift-alarm-signed-apk
          path: android-alarm-test/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Create update metadata
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('android-alarm-test/app/build.gradle').read_text()
          code = int(re.search(r'versionCode (\d+)', text).group(1))
          name = re.search(r"versionName '([^']+)'", text).group(1)
          Path('update.json').write_text(json.dumps({'versionCode': code, 'versionName': name}))
          PY
      - name: Publish signed app update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shift-alarm-current
          name: 교대 기상 알람 최신 버전
          prerelease: true
          make_latest: false
          files: |
            android-alarm-test/app/build/outputs/apk/release/app-release.apk
            update.json
      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shift-alarm.p12"
