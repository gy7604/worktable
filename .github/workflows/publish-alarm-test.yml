name: Publish alarm test APK
on:
  push:
    paths:
      - 'downloads/shift-alarm-test.apk'
      - '.github/workflows/publish-alarm-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: |
          test -s downloads/shift-alarm-test.apk
          unzip -t downloads/shift-alarm-test.apk
      - name: Publish stable download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alarm-test
          name: 교대 알람 연동 테스트
          body: |
            삼성 시계 알람 등록·취소 지원 여부를 확인하는 테스트 앱입니다.
          prerelease: true
          files: downloads/shift-alarm-test.apk
          make_latest: false
