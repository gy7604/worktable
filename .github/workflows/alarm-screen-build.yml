name: Alarm screen APK
on:
  push:
    paths:
      - 'android-alarm-test/**'
      - '.github/workflows/alarm-screen-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android-alarm-test
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shift-alarm-0.4
          path: android-alarm-test/app/build/outputs/apk/debug/app-debug.apk
